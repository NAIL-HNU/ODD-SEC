version: '3.8'

services:
  panorama-detection:
    build: .
    container_name: panorama-detection
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # 挂载ROS工作空间
      - ./src:/catkin_ws/src
      - ./launch:/catkin_ws/launch
      - ./config:/catkin_ws/config
      - ./model:/catkin_ws/model
      # 挂载数据目录
      - ./data:/catkin_ws/data
      # 挂载X11显示 (Linux)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # 挂载设备 (如果需要访问相机)
      - /dev:/dev:rw
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: bash

  # 如果需要GPU支持，使用这个服务
  panorama-detection-gpu:
    build: .
    container_name: panorama-detection-gpu
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./src:/catkin_ws/src
      - ./launch:/catkin_ws/launch
      - ./config:/catkin_ws/config
      - ./model:/catkin_ws/model
      - ./data:/catkin_ws/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: bash 